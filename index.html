<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>p5.js starter</title>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,600&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400&amp;display=swap" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="wordmark">
          <span class="mark" aria-hidden="true">p5</span>
          <h1 class="brand" aria-label="p5.js starter">p5.js</h1>
          <span class="descriptor">starter</span>
        </div>
        <span class="header-note">WEBGL / LIVE</span>
      </header>
      <main class="workspace">
        <section class="stage" aria-label="Prévia da sketch">
          <div class="stage-bar">
            <span>01 / CANVAS</span>
            <div class="readout"><span>FPS</span><output id="fps">—</output></div>
          </div>
          <figure id="sketchContainer" aria-label="Sketch 3D com cubo giratório, esfera central e cursor interativo."></figure>
        </section>
        <aside class="inspector" aria-labelledby="inspector-title">
          <div class="inspector-header">
            <div><span class="eyebrow">02 / CONTROLES</span><h2 id="inspector-title">Renderização</h2></div>
            <button id="reset" type="button" class="reset-button">RESET</button>
          </div>
          <div id="controls"></div>
        </aside>
      </main>
    </div>
  </body>
</html>
