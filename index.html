<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>p5.js starter</title>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,600&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400&amp;display=swap" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="wordmark">
          <span class="mark" aria-hidden="true">p5</span>
          <span class="brand">p5.js</span>
          <span class="descriptor">starter</span>
        </div>
      </header>
      <main class="stage">
        <div class="readout"><span>FPS</span><output id="fps">—</output></div>
        <figure id="sketchContainer" aria-label="Animated sketch with a rotating cube and sphere, and a circle that follows the pointer."></figure>
      </main>
    </div>
